<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="en">

<head>
    <title>Forsu Soft | Docs</title>
    <meta charset="UTF-8">
    <meta name="description" content="Forsu Soft Documentations Page.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="page-docs">
    <div id="app">

        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="images/forsusoft_logo.png" alt="ForsuSoft logo" class="me-2 header-logo-img">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="projects.html">PROJECTS</a></li>
                        <li class="nav-item"><a class="nav-link" href="tools.html">TOOLS & TEMPLATES</a></li>
                        <li class="nav-item"><a class="nav-link active" href="#">DOCS</a></li>
                    </ul>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="about.html">ABOUT</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">CONTACT</a></li>
                        <li class="nav-item"><a class="nav-link fw-bold text-warning" href="donate.html">DONATE</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="content-wrapper">
            <div class="docs-layout">

                <!-- SIDEBAR TOGGLE (mobile) -->
                <button class="docs-sidebar-toggle d-lg-none" @click="sidebarOpen = !sidebarOpen"
                    :aria-expanded="sidebarOpen.toString()">
                    <i class="fa" :class="sidebarOpen ? 'fa-times' : 'fa-bars'"></i>
                </button>

                <!-- SIDEBAR -->
                <aside class="docs-sidebar" :class="{ 'docs-sidebar--open': sidebarOpen }">
                    <div class="docs-sidebar-header">
                        <i class="fa-solid fa-book me-2"></i>Documentation
                    </div>
                    <nav class="docs-nav">
                        <div v-if="loading" class="docs-nav-loading">
                            <i class="fa fa-spinner fa-spin me-2"></i>Loading...
                        </div>
                        <div v-else-if="error" class="docs-nav-error">
                            <i class="fa-solid fa-exclamation-triangle me-2"></i>{{ error }}
                        </div>
                        <template v-else>
                            <div v-for="group in groupedDocs" :key="group.project">
                                <div class="docs-nav-group">{{ group.project }}</div>
                                <button v-for="doc in group.docs" :key="doc.id" class="docs-nav-item"
                                    :class="{ active: selectedDoc && selectedDoc.id === doc.id }"
                                    @click="selectDoc(doc)">
                                    <i class="fa fa-file-pdf-o me-2"></i>{{ doc.name }}
                                </button>
                            </div>
                            <p v-if="docs.length === 0" class="docs-nav-empty">No documents yet.</p>
                        </template>
                    </nav>
                </aside>

                <!-- PDF VIEWER -->
                <div class="docs-viewer">

                    <!-- Placeholder -->
                    <div v-if="!selectedDoc" class="docs-placeholder">
                        <i class="fa-solid fa-file-pdf-o fa-3x mb-3"></i>
                        <p>Select a document from the sidebar</p>
                    </div>

                    <!-- EmbedPDF container — always in DOM, hidden when no doc selected -->
                    <div id="embedpdf-container" :style="{ display: selectedDoc ? 'block' : 'none' }"
                        oncontextmenu="return false">
                    </div>

                    <!-- Loading overlay -->
                    <div v-if="viewerLoading" class="docs-viewer-loading">
                        <i class="fa fa-spinner fa-spin fa-2x"></i>
                    </div>

                </div>

            </div>
        </main>

        <!-- FOOTER -->
        <footer class="bg-dark text-light py-3">
            <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center small">
                <span>© 2026 Forsu Soft</span>
                <a class="nav-link-footer" href="impressum.html">Impressum</a>
                <a class="nav-link-footer" href="datenschutz.html">Privacy Policy</a>
                <span>Game &amp; Software Development Studio</span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="scripts/docs-page.js"></script>
</body>

</html>
