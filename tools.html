<!DOCTYPE html>
<html lang="EN">

<head>
    <title>Forsu Soft | Tools</title>
    <meta charset="UTF-8">
    <meta name="description" content="Game development and Software development studio.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="page-tools">
    <div id="app">
        <!-- HEADER / NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="images/forsusoft_logo.png" alt="ForsuSoft logo" class="me-2 header-logo-img">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="projects.html">PROJECTS</a></li>
                        <li class="nav-item"><a class="nav-link active" href="#">TOOLS & TEMPLATES</a></li>
                        <li class="nav-item"><a class="nav-link" href="docs.html">DOCS</a></li>
                    </ul>

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="about.html">ABOUT</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">CONTACT</a></li>
                        <li class="nav-item">
                            <a class="nav-link fw-bold text-warning" href="donate.html">DONATE</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="content-wrapper">
            <section class="tools-section py-5">
                <div class="container">

                    <!-- Hero -->
                    <div class="projects-hero mb-5">
                        <p class="projects-hero-label">All Assets</p>
                        <h1 class="projects-hero-title">Tools & Templates</h1>
                        <p class="projects-hero-sub">
                            Developer tools, utilities and templates made by ForsuSoft — free and paid assets.
                        </p>
                    </div>

                    <!-- Loading -->
                    <div v-if="loading" class="text-center text-secondary py-5">
                        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    </div>

                    <!-- Error -->
                    <div v-else-if="error" class="text-center py-5" style="color:#e04848">
                        <i class="fa-solid fa-exclamation-triangle me-2"></i>{{ error }}
                    </div>

                    <template v-else>

                        <!-- Category Filter -->
                        <div class="d-flex flex-wrap gap-2 mb-4" v-if="categories.length > 1">
                            <button v-for="cat in categories" :key="cat" class="btn btn-sm"
                                :class="activeCategory === cat ? 'btn-danger' : 'btn-outline-secondary'"
                                @click="activeCategory = cat">
                                {{ cat }}
                            </button>
                        </div>

                        <!-- Cards -->
                        <div class="row g-4">
                            <div class="col-md-4" v-for="tool in filteredTools" :key="tool.id">
                                <div class="card bg-dark text-light h-100 tool-card">
                                    <div class="card-body d-flex flex-column">

                                        <!-- Icon + Name -->
                                        <div class="d-flex align-items-center gap-3 mb-3">
                                            <div class="tool-card-icon">
                                                <i :class="[tool.icon ? (tool.icon.startsWith('bi-') ? 'bi ' + tool.icon : tool.icon) : 'bi bi-wrench']"></i>
                                            </div>
                                            <h5 class="card-title mb-0">{{ tool.name }}</h5>
                                        </div>

                                        <!-- Badges -->
                                        <div class="d-flex flex-wrap gap-2 mb-2">
                                            <span class="badge tool-badge-category">{{ tool.category }}</span>
                                            <span v-if="tool.free" class="badge bg-success">Free</span>
                                            <span v-else class="badge bg-warning text-dark">Paid</span>
                                            <span class="badge bg-secondary" v-if="tool.version">v{{ tool.version
                                                }}</span>
                                        </div>

                                        <!-- Description -->
                                        <p class="card-text flex-grow-1 mt-2 small">{{ tool.shortDescription }}</p>

                                        <!-- Actions -->
                                        <div class="d-flex flex-wrap align-items-center gap-2 mt-auto pt-3">

                                            <!-- Free: download or soon -->
                                            <template v-if="tool.free">
                                                <a v-if="tool['download-link']" :href="tool['download-link']"
                                                    class="btn btn-sm btn-danger" target="_blank"
                                                    rel="noopener noreferrer">
                                                    <i class="fa-solid fa-download me-1"></i>Download
                                                </a>
                                                <span v-else class="btn btn-sm btn-outline-secondary disabled">
                                                    <i class="fa-solid fa-clock me-1"></i>Soon
                                                </span>
                                            </template>

                                            <!-- Paid: buy (itchio / another link) or soon -->
                                            <template v-else>
                                                <a v-if="tool['buy-link']" :href="tool['buy-link']"
                                                    class="btn btn-sm btn-warning text-dark fw-bold" target="_blank"
                                                    rel="noopener noreferrer">
                                                    <i class="fa-solid fa-shopping-cart me-1"></i>Buy — {{ tool.price }}
                                                </a>
                                                <span v-else class="btn btn-sm btn-outline-secondary disabled">
                                                    <i class="fa-solid fa-clock me-1"></i>Soon
                                                </span>
                                            </template>

                                            <!-- GitHub -->
                                            <a v-if="tool['github-link']" :href="tool['github-link']"
                                                class="btn btn-sm btn-outline-light p-1 d-inline-flex align-items-center justify-content-center"
                                                target="_blank" rel="noopener noreferrer" title="GitHub">
                                                <img src="images/icons/github.svg" alt="GitHub" class="store-icon" style="height: 22px;">
                                            </a>

                                            <!-- Docs -->
                                            <a v-if="tool['docs-link']" :href="tool['docs-link']"
                                                class="btn btn-sm btn-outline-light" title="Documentation">
                                                <i class="fa fa-book"></i>
                                            </a>

                                        </div>

                                    </div>
                                </div>
                            </div>

                            <!-- Empty state -->
                            <div v-if="filteredTools.length === 0" class="text-center text-secondary py-5">
                                <i class="fa fa-inbox fa-2x mb-3"></i>
                                <p>No tools in this category yet.</p>
                            </div>
                        </div>

                    </template>
                </div>
            </section>
        </main>

        <!-- FOOTER -->
        <footer class="bg-dark text-light py-3 mt-auto">
            <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center small">
                <span>© 2026 ForsuSoft</span>
                <a class="nav-link-footer" href="impressum.html">Impressum</a>
                <a class="nav-link-footer" href="datenschutz.html">Privacy Policy</a>
                <span>Game &amp; Software Development Studio</span>
            </div>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <!-- Vue 3 JS + OWN SCRIPTS -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="scripts/tools-page.js"></script>
</body>

</html>
